                - heading "مكملات الأداء لكمال الأجسام والجيم" [level=1] [ref=f106e2001]
                - paragraph [ref=f106e2002]: "مكملات الأداء هي المجموعة التي يسأل عنها كل من بدأ في الجيم: بروتين، وكرياتين، وما قبل التمرين، وأحماض أمينية."
                - link "اعرض منتجات هذا الهدف" [ref=f106e2003] [cursor=pointer]:
                  - /url: "#ks-grid"
            - paragraph [ref=f106e2006]: "مكملات الأداء هي المجموعة التي يسأل عنها كل من بدأ في الجيم: بروتين، وكرياتين، وما قبل التمرين، وأحماض أمينية. لا تحتاج إليها كلها. البروتين يكمل احتياجك اليومي، والكرياتين يدعم التمارين القصيرة عالية الشدة، وما عداهما إضافة اختيارية. ابدأ بواحد، وثبت عليه، ثم أضف ما تحتاجه فعلا."
            - region [ref=f106e2007]:
              - heading "ما هي مكملات الجيم وما الذي يحتاجه المبتدئ" [level=2] [ref=f106e2008]
              - generic [ref=f106e2009]:
                - paragraph [ref=f106e2010]: مكملات الجيم اسم عام لكل منتج يؤخذ لتكملة الطعام في فترة التدريب. أكثرها انتشارا أربعة. الأول البروتين، وهو مسحوق من مصل الحليب أو من النبات يعطي 20 إلى 25 غراما من البروتين في السكوب، ويستخدم عندما لا يغطي الطعام احتياجك اليومي. الثاني الكرياتين مونوهيدرات، وهو مركب يوجد طبيعيا في اللحوم، ويدعم إنتاج الطاقة في التمارين القصيرة عالية الشدة، بجرعة يومية ثابتة 3 إلى 5 غرامات. الثالث مكملات ما قبل التمرين، وهي خلطة كافيين وسيترولين وبيتا الانين تؤخذ قبل الحصة بنصف ساعة لدعم التركيز والطاقة. الرابع الأحماض الأمينية مثل بي سي اي اي و اي اي اي، وهي لبنات البروتين نفسها في صورة مشروب.
                - paragraph [ref=f106e2011]: المبتدئ لا يحتاج إلى الأربعة. يحتاج أولا إلى برنامج تدريب ثابت، ونوم كاف، وطعام يغطي البروتين. ثم يضيف واي بروتين إن كان الطعام لا يكفي، وكرياتين إن كان يتدرب بالأثقال بانتظام. ما قبل التمرين والأحماض الأمينية تأتي لاحقا، وقد لا تأتي أبدا. المكمل يسد فجوة محددة، ولا يعوض ما ينقص في الأساسيات. إن أردت أن تعرف أي فجوة عندك، فأرسل لنا سؤالا مكتوبا وسنجيبك بلا مبالغة.
