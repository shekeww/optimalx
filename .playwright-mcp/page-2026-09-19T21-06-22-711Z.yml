                    - region "لماذا قد تجد سعرا أقل في مكان آخر؟":
                      - paragraph [ref=f106e1485]: السعر المعروض على الصفحة هو السعر النهائي الذي تدفعه. ومعه نكتب عدد الحصص وحجم الحصة، فاقسم السعر على عدد الحصص لتعرف تكلفة الحصة الواحدة، فهي المقارنة الصحيحة بين عبوتين. العبوات تختلف في وزن السكوب وفي عدد الحصص، فالعبوة الأقل سعرا قد تكون الأعلى تكلفة في الحصة. وإن كان الفرق على المنتج نفسه، فقارن الحجم والنكهة وتاريخ الصلاحية قبل أن تقارن الرقم وحده.
                  - generic [ref=f106e1486]:
                    - heading [level=3] [ref=f106e1487]:
                      - button "ما أهم مكملات الجيم للمبتدئ؟" [ref=f106e1488] [cursor=pointer]:
                        - generic [aria-hidden]: 
                    - region "ما أهم مكملات الجيم للمبتدئ؟":
                      - paragraph [ref=f106e1491]: واي بروتين إذا كان طعامك لا يغطي احتياجك من البروتين، وكرياتين مونوهيدرات بجرعة يومية ثابتة. هذان يكفيان في الأشهر الأولى. ما قبل التمرين والأحماض الأمينية إضافات لاحقة، وليست شرطا للبداية. الأهم من كل مكمل هو النوم والطعام والانتظام في التمرين.
                  - generic [ref=f106e1492]:
                    - heading [level=3] [ref=f106e1493]:
                      - button "كم سكوب بروتين في اليوم؟" [ref=f106e1494] [cursor=pointer]:
                        - generic [aria-hidden]: 
                    - region "كم سكوب بروتين في اليوم؟":
                      - paragraph [ref=f106e1497]: يعطي السكوب الواحد عادة 20 إلى 25 غراما من البروتين، ويكفي معظم المتدربين سكوب إلى سكوبين يوميا لتكملة ما يأتي من الطعام. الأهم إجمالي البروتين خلال اليوم من الطعام والمكمل معا. الملصق يحدد وزن السكوب لكل منتج، ونعرضه في صفحة المنتج.
                  - generic [ref=f106e1498]:
                    - heading [level=3] [ref=f106e1499]:
                      - 'button "متى آخذ الكرياتين: قبل التمرين أم بعده؟" [ref=f106e1500] [cursor=pointer]':
                        - generic [aria-hidden]: 
                    - 'region "متى آخذ الكرياتين: قبل التمرين أم بعده؟"':
                      - paragraph [ref=f106e1503]: لا يوجد فرق حاسم بين الوقتين. الأهم هو الانتظام على جرعة يومية ثابتة، في أيام التمرين وأيام الراحة على حد سواء. من يفضل تحديد وقت يأخذه بعد التمرين مع وجبة تحتوي على كربوهيدرات. اقرأ دليل الكرياتين الكامل إن كنت تبدأ لأول مرة.
                  - generic [ref=f106e1504]:
                    - heading [level=3] [ref=f106e1505]:
                      - button "هل البروتين باودر مضر؟" [ref=f106e1506] [cursor=pointer]:
                        - generic [aria-hidden]: 
                    - region "هل البروتين باودر مضر؟":
                      - paragraph [ref=f106e1509]: مسحوق البروتين مكمل غذائي مصدره الحليب أو النبات، ويستخدمه الأشخاص الأصحاء لتكملة احتياج البروتين اليومي ضمن طعام متوازن. لا يغني عن الوجبات ولا يعوض نقص النوم. من لديه حالة صحية يستشير مختصا قبل استخدام أي مكمل، ونحن لا نجيب عن هذه الأسئلة كتابة.
