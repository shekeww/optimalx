          - region "ما أهم مكملات الجيم للمبتدئ؟":
            - paragraph [ref=f174e229]: واي بروتين إذا كان طعامك لا يغطي احتياجك من البروتين، وكرياتين مونوهيدرات بجرعة يومية ثابتة. هذان يكفيان في الأشهر الأولى. ما قبل التمرين والأحماض الأمينية إضافات لاحقة، وليست شرطا للبداية. الأهم من كل مكمل هو النوم والطعام والانتظام في التمرين.
        - generic [ref=f174e230]:
          - heading [level=3] [ref=f174e231]:
            - button "كم سكوب بروتين في اليوم؟" [ref=f174e232] [cursor=pointer]
          - region "كم سكوب بروتين في اليوم؟":
            - paragraph [ref=f174e235]: يعطي السكوب الواحد عادة 20 إلى 25 غراما من البروتين، ويكفي معظم المتدربين سكوب إلى سكوبين يوميا لتكملة ما يأتي من الطعام. الأهم إجمالي البروتين خلال اليوم من الطعام والمكمل معا. الملصق يحدد وزن السكوب لكل منتج، ونعرضه في صفحة المنتج.
        - generic [ref=f174e236]:
          - heading [level=3] [ref=f174e237]:
            - 'button "متى آخذ الكرياتين: قبل التمرين أم بعده؟" [ref=f174e238] [cursor=pointer]'
          - 'region "متى آخذ الكرياتين: قبل التمرين أم بعده؟"':
            - paragraph [ref=f174e241]: لا يوجد فرق حاسم بين الوقتين. الأهم هو الانتظام على جرعة يومية ثابتة، في أيام التمرين وأيام الراحة على حد سواء. من يفضل تحديد وقت يأخذه بعد التمرين مع وجبة تحتوي على كربوهيدرات. اقرأ دليل الكرياتين الكامل إن كنت تبدأ لأول مرة.
        - generic [ref=f174e242]:
          - heading [level=3] [ref=f174e243]:
            - button "هل البروتين باودر مضر؟" [ref=f174e244] [cursor=pointer]
          - region "هل البروتين باودر مضر؟":
