<!--
  OptimalX icon sprite (DIRECTION 8.7, BUILD.md 3.5). Fifty-three symbols on a 24
  by 24 grid, stroke currentColor at 1.8 (one weight for every symbol, brand or
  chrome: no per-symbol override), miter joins at limit 4, square caps,
  geometry on the half pixel, no rounded terminals and no rx. Exactly one
  element per brand symbol carries class="ox-icon__accent" (fill --ox-accent,
  no stroke); ox-tick is the one symbol whose accent is the stroke itself. Any
  structural diagonal a new or redrawn symbol draws sits at 34 degrees from
  vertical, or its 56 degree complement (the same line, the other reference
  axis) — parallel to the X mark's bars, measured 2026-09-22 off
  public/assets/brand/optimalx-mark-512.png (34.2, 34.3, 33.9, 34.1 across
  four edges), never 45 and not the 22 this file used before that
  measurement; ox-bolt is the clearest example. None of these icons indicates
  direction, so none mirrors under RTL.

  Chrome icons (search, cart, user, heart, menu, chevrons, truck, filter,
  whatsapp, close, play) stay on sicon-*, per BUILD.md:221 — including new
  chevrons: `ox-chevron-up`/`ox-chevron-end` were retired rather than added
  here. ox-chevron-down is a legacy exception: three Header-owned components
  this batch could not edit still read it (docs/build/progress/S2a.md), so it
  stays, unstyled by the weight law's removal of per-symbol overrides same as
  everything else, but nothing new should reference it. ox-authentic,
  ox-shipping and ox-help are the same kind of legacy exception, superseded by
  ox-shield-check, ox-truck and ox-headset for every reader this batch could
  reach; the full list of remaining readers is in docs/build/progress/S2a.md.

  Inlined once by <Sprite />; referenced with <use href="#ox-{name}">.
-->
