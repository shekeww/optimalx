# This starter kit is its own pnpm workspace root, so a scaffolded copy
# carries these settings with it (pnpm 10+ reads settings here, not .npmrc).
packages:
  - '.'

# Salla ships fixes on the beta channel; exempt the scope from pnpm's
# release-age delay so fresh releases install immediately.
minimumReleaseAgeExclude:
  - '@salla.sa/*'

# Skip the pre-run lockfile sweep; run `pnpm install` explicitly when deps change.
verifyDepsBeforeRun: false

# Build scripts required by the toolchain (vite/esbuild, the SSR runtime, sharp, …).
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  bufferutil: true
  es5-ext: true
  esbuild: true
  protobufjs: true
  sharp: true
  utf-8-validate: true
  workerd: true

# Audit GHSA-rgj7-g3m4-5g8c (sharp <0.35.4, libheif). sharp is transitive only
# (webpack > minimizer-webpack-plugin and miniflare, 19 paths); pin the
# every requester to the patched release (a range selector only matched the
# miniflare path, not webpack's optional peer). pnpm 10+ reads overrides here.
overrides:
  sharp: '0.35.4'
